[workspace]
resolver = "2"
members = [
    "crates/saccadion-connectome",
    "crates/saccadion-chess",
    "crates/saccadion-nn",
    "crates/saccadion-data",
    "crates/saccadion-search",
    "crates/saccadion-uci",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Saccadion Research Team"]
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
